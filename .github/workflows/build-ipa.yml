name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [codex/deepseek-parity]
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> $GITHUB_ENV
          DEVELOPER_DIR=$X/Contents/Developer xcodebuild -version
      - name: Tools
        run: |
          brew install ninja libarchive meson llvm lld ripgrep || true
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
      - name: Fetch upstreams
        run: Scripts/fetch-upstreams.sh
      - name: Build iSH sandbox artifacts
        run: ISH_MESON=$(command -v meson) ISH_NINJA=$(command -v ninja) ISH_LIBARCHIVE_PREFIX=$(brew --prefix libarchive) Scripts/build-ish-sandbox.sh all
      - name: Lock CI-built artifact hashes
        run: |
          for p in $(jq -r '.artifacts[].path' Dependencies/artifacts.lock.json); do
            ls -l "$p"
            h=$(shasum -a 256 "$p" | awk '{print $1}')
            jq --arg p "$p" --arg h "$h" '(.artifacts[] | select(.path==$p) | .sha256) = $h' Dependencies/artifacts.lock.json > /tmp/lock && mv /tmp/lock Dependencies/artifacts.lock.json
          done
          cat Dependencies/artifacts.lock.json
      - name: Build device app
        run: |
          xcodebuild -project HarnessMobile.xcodeproj -scheme HarnessMobile -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath /tmp/dd \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build > /tmp/build.log 2>&1 || { grep -E "error:" /tmp/build.log | head -50; tail -200 /tmp/build.log; exit 1; }
          grep -E "BUILD" /tmp/build.log
      - name: Package IPA
        run: |
          APP=$(ls -d /tmp/dd/Build/Products/Release-iphoneos/*.app | head -1)
          lipo -info "$APP/$(basename "$APP" .app)"
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          cd out && zip -qry HarnessMobile-unsigned.ipa Payload && ls -l *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: HarnessMobile-unsigned-ipa
          path: out/HarnessMobile-unsigned.ipa
